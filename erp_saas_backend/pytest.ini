# ═══════════════════════════════════════════════════════════
#  Configuración de pytest
#
#  Se corre DENTRO DEL CONTENEDOR: desde el venv de Windows no se
#  llega a Postgres (ahí solo van `check` y `makemigrations`).
#
#      docker compose up --build -d
#      docker compose exec erp-backend pytest
#
#  Requisito: el usuario de Postgres necesita permiso CREATEDB,
#  porque pytest-django crea y borra la base `test_erp`.
# ═══════════════════════════════════════════════════════════

[pytest]
python_files = test_*.py
# Las capas que hoy tienen código. Al crear una app en una carpeta que
# no esté acá, sumarla: si no, sus tests no se recogen y la corrida da
# verde sin haberlos ejecutado.
testpaths = core comun servicios dominios procesos

# `--ds` va acá y NO como `DJANGO_SETTINGS_MODULE = ...`, a propósito.
# En pytest-django la precedencia es:
#
#     --ds (línea de comandos)  >  variable de entorno  >  pytest.ini
#
# Y el contenedor recibe DJANGO_SETTINGS_MODULE=config.settings.local
# por el env_file del compose, así que puesto en el ini quedaba
# ignorado. `addopts` se trata como línea de comandos y sí gana.
#
# -ra = resumen de todo lo que no pasó limpio al final.
addopts = -ra --ds=config.settings.test
