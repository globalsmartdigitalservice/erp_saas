

services:

  erp-frontend:
    container_name: erp-frontend
    image: erp-frontend:1.0.0
    build:
      context: ../erp_saas_frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/graphql/ 
    restart: unless-stopped
    ports:
      - "10001:8080" 
    depends_on:
      - erp-backend
    networks:
      - erp-frontend-backend-net

  erp-backend:
    container_name: erp-backend
    image: erp-backend:1.0.0
    build:
      context: ../erp_saas_backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py cargar_semillas &&
             python manage.py crear_administrador &&
             python manage.py generar_permisos &&
             python manage.py collectstatic --noinput &&
             uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --workers 2"

    #  python manage.py cargar_semillas &&
    ports:
      - "10000:8000"
    env_file:
      - ../erp_saas_backend/.env
    networks:
      - erp-frontend-backend-net
  
networks:
  erp-frontend-backend-net:
    driver: bridge

