const navEl=document.getElementById('nav');
const groups=[...new Set(M.map(m=>m.g))];
let html='';
groups.forEach(g=>{
  const ac=M.find(m=>m.g===g).ac;
  html+=`<div class="glabel ${ac}">${g}<span class="ln"></span></div>`;
  M.filter(m=>m.g===g).forEach(m=>{
    html+=`<div class="nv" data-n="${m.n}" style="--ac:${ACC[m.ac]}" onclick="sel('${m.n}')"><span class="num">${m.n}</span><span>${m.t}</span></div>`;
    if(m.sub){m.sub.forEach(s=>{html+=`<div class="nv sub" data-n="${s.n}" style="--ac:${ACC[m.ac]}" onclick="sel('${s.n}')"><span class="num">${s.n}</span><span>${s.t}</span></div>`;if(s.sub){s.sub.forEach(ss=>{html+=`<div class="nv sub2" data-n="${ss.n}" style="--ac:${ACC[m.ac]}" onclick="sel('${ss.n}')"><span class="num">${ss.n}</span><span>${ss.t}</span></div>`;});}});}
  });
});
navEl.innerHTML=html;
const FLAT=[];M.forEach(m=>{FLAT.push(m);if(m.sub)m.sub.forEach(s=>{FLAT.push(Object.assign({},s,{g:m.g,ac:m.ac}));if(s.sub)s.sub.forEach(ss=>FLAT.push(Object.assign({},ss,{g:m.g,ac:m.ac})));});});
let current=null;
async function sel(n){
  const m=FLAT.find(x=>x.n===n); if(!m) return;
  if(m.sub&&m.sub.length&&!m.c){return sel(m.sub[0].n);}
  document.querySelectorAll('.nv').forEach(e=>e.classList.toggle('active',e.dataset.n===n));
  const c=ACC[m.ac];
  document.getElementById('crumb').textContent=`${m.g} · módulo ${m.n}`;
  document.getElementById('crumb').style.color=c;
  document.getElementById('title').textContent=m.t;
  document.getElementById('desc').textContent=m.d;
  const host=document.getElementById('diagram');
  host.removeAttribute('data-processed'); host.innerHTML='';
  try{ const {svg}=await mermaid.render('mm'+n.replace(/\W/g,'')+Date.now(), m.c); host.innerHTML=svg; }
  catch(e){ host.innerHTML='<p style="color:#b00;font-family:monospace">Error: '+e.message+'</p>'; }
  const host2=document.getElementById('diagram2');
  host2.removeAttribute('data-processed'); host2.innerHTML=''; host2.style.display='none';
  if(m.c2){
    try{ const r2=await mermaid.render('mm2'+n.replace(/\W/g,'')+Date.now(), m.c2); host2.innerHTML=r2.svg; host2.style.display='flex'; }
    catch(e){ host2.innerHTML='<p style="color:#b00;font-family:monospace">Error: '+e.message+'</p>'; host2.style.display='flex'; }
  }
  document.querySelector('.content').scrollTop=0;
}
